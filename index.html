<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cataloging Decision Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===== Design System Tokens ===== */
:root {
  /* Fonts */
  --font-sans: "Libre Franklin", Arial, Helvetica, sans-serif;
  --font-display: var(--font-sans);
  --font-condensed: var(--font-sans);
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Primary */
  --cuny-blue: #0033A1;
  --taxi: #FFB71B;

  /* Secondary */
  --indigo: #011D49;
  --azure: #1F5CFF;
  --deep-cyan: #00AFEF;
  --sky: #A3C9FF;
  --lemonade: #FFEE1D;
  --cream: #FFFCD5;

  /* Neutral */
  --pearl: #F7F4EB;
  --dove: #D8D7D6;
  --slate: #688197;
  --charcoal: #383838;
  --pewter: #76777A;
  --ochre: #C89210;
  --umber: #896B25;

  /* Accent */
  --strawberry: #EA0045;
  --sea-green: #005C5A;
  --chartreuse: #C2D500;
  --liberty: #45C2B1;
  --mint: #B5EBD8;
  --cranberry: #BF0D3E;

  --white: #FFFFFF;
  --black: #000000;

  /* Working scales */
  --blue-950: #01122E;
  --blue-900: #011D49;
  --blue-800: #002679;
  --blue-700: #0033A1;
  --blue-600: #0F45BE;
  --blue-500: #1F5CFF;
  --blue-400: #5C87FF;
  --blue-300: #A3C9FF;
  --blue-200: #C6DBFF;
  --blue-100: #E4EEFF;
  --blue-50: #F2F7FF;

  --gray-950: #1A1A1A;
  --gray-900: #383838;
  --gray-800: #4D4D4D;
  --gray-700: #5F6062;
  --gray-600: #76777A;
  --gray-500: #949599;
  --gray-450: #8A8B8F;
  --gray-400: #B4B4B3;
  --gray-300: #D8D7D6;
  --gray-200: #E6E5E2;
  --gray-150: #EEEDE8;
  --gray-100: #F2F1EC;
  --gray-50: #F7F4EB;

  /* Status */
  --green-700: #004745;
  --green-600: #005C5A;
  --green-100: #B5EBD8;
  --amber-700: #896B25;
  --amber-600: #C89210;
  --amber-100: #FFFCD5;
  --red-700: #8E0A2E;
  --red-600: #BF0D3E;
  --red-100: #FFCBCA;

  /* Semantic aliases — Text */
  --text-body: var(--charcoal);
  --text-heading: var(--indigo);
  --text-muted: var(--gray-800);
  --text-subtle: var(--gray-700);
  --text-inverse: var(--white);
  --text-link: var(--cuny-blue);
  --text-link-hover: var(--indigo);
  --text-accent: var(--cuny-blue);
  --text-danger: var(--cranberry);
  --text-success: var(--sea-green);
  --text-warning: var(--umber);

  /* Surfaces */
  --surface-page: var(--white);
  --surface-sunken: var(--pearl);
  --surface-card: var(--white);
  --surface-raised: var(--white);
  --surface-brand: var(--cuny-blue);
  --surface-brand-deep: var(--indigo);
  --surface-brand-subtle: var(--blue-50);
  --surface-neutral-subtle: var(--gray-100);
  --surface-hover: var(--gray-100);
  --surface-active: var(--gray-200);

  /* Borders */
  --border-subtle: var(--gray-200);
  --border-default: var(--dove);
  --border-strong: var(--gray-450);
  --border-control: var(--gray-450);
  --border-brand: var(--cuny-blue);
  --border-focus: var(--azure);
  --border-success: #8FD9BE;
  --border-warning: #EDDF9E;
  --border-danger: #F5A9A7;
  --border-info: var(--blue-200);

  /* Controls */
  --control-primary-bg: var(--cuny-blue);
  --control-primary-bg-hover: var(--blue-800);
  --control-primary-bg-active: var(--indigo);
  --control-primary-fg: var(--white);
  --control-secondary-bg: var(--white);
  --control-secondary-fg: var(--cuny-blue);
  --control-secondary-border: var(--cuny-blue);
  --control-ghost-fg: var(--gray-700);
  --control-disabled-bg: var(--gray-150);
  --control-disabled-fg: var(--gray-700);

  /* Rules */
  --rule-brand: var(--cuny-blue);
  --rule-accent: var(--taxi);
  --rule-hairline: var(--gray-200);

  /* Typography sizes */
  --text-2xs: 11px;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-md: 18px;
  --text-lg: 20px;
  --text-xl: 24px;
  --text-2xl: 30px;
  --text-3xl: 38px;

  /* Weights */
  --weight-light: 300;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;

  /* Leading */
  --leading-tight: 1.08;
  --leading-snug: 1.2;
  --leading-heading: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Tracking */
  --tracking-tightest: -.02em;
  --tracking-tight: -.01em;
  --tracking-normal: 0;
  --tracking-wide: .02em;
  --tracking-caps: .08em;

  /* Composed type roles */
  --type-h1: var(--weight-bold) var(--text-3xl)/var(--leading-snug) var(--font-sans);
  --type-h2: var(--weight-bold) var(--text-2xl)/var(--leading-heading) var(--font-sans);
  --type-h3: var(--weight-semibold) var(--text-xl)/var(--leading-heading) var(--font-sans);
  --type-h4: var(--weight-semibold) var(--text-md)/var(--leading-heading) var(--font-sans);
  --type-body: var(--weight-regular) var(--text-base)/var(--leading-relaxed) var(--font-sans);
  --type-body-sm: var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-sans);
  --type-lead: var(--weight-regular) var(--text-md)/var(--leading-relaxed) var(--font-sans);
  --type-label: var(--weight-semibold) var(--text-sm)/var(--leading-normal) var(--font-sans);
  --type-eyebrow: var(--weight-bold) var(--text-xs)/var(--leading-normal) var(--font-sans);
  --type-mono: var(--weight-regular) var(--text-sm)/var(--leading-normal) var(--font-mono);

  --measure-prose: 68ch;
  --measure-narrow: 52ch;

  /* Spacing */
  --space-0: 0px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Radii */
  --radius-none: 0px;
  --radius-xs: 2px;
  --radius-sm: 3px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-xl: 8px;
  --radius-pill: 999px;

  /* Border widths */
  --border-width-hairline: 1px;
  --border-width-thick: 2px;
  --border-width-rule: 4px;

  /* Container */
  --container-prose: 760px;
  --container-content: 1080px;
  --gutter-page: 24px;

  /* Elevation */
  --shadow-none: none;
  --shadow-xs: 0 1px 1px rgba(26,26,27,.05);
  --shadow-sm: 0 1px 2px rgba(26,26,27,.07), 0 1px 1px rgba(26,26,27,.04);
  --shadow-md: 0 2px 4px rgba(26,26,27,.08), 0 4px 12px rgba(26,26,27,.06);
  --shadow-lg: 0 8px 24px rgba(26,26,27,.10), 0 2px 6px rgba(26,26,27,.06);
  --focus-ring: 0 0 0 3px rgba(49,89,180,.35);
  --focus-ring-inverse: 0 0 0 3px rgba(255,255,255,.6);

  /* Motion */
  --duration-instant: 80ms;
  --duration-fast: 120ms;
  --duration-normal: 180ms;
  --duration-slow: 260ms;
  --ease-standard: cubic-bezier(.2,0,.2,1);
  --ease-out: cubic-bezier(0,0,.2,1);
  --ease-in-out: cubic-bezier(.4,0,.2,1);
  --transition-control: background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard),
    color var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-instant: 1ms;
    --duration-fast: 1ms;
    --duration-normal: 1ms;
    --duration-slow: 1ms;
  }
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* ===== Base Reset ===== */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font: var(--type-body);
  color: var(--text-body);
  background: var(--surface-sunken);
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
}
h1, h2, h3, h4, h5, h6 { margin: 0; color: var(--text-heading); text-wrap: balance; }
h1 { font: var(--type-h1); letter-spacing: var(--tracking-tight); }
h2 { font: var(--type-h2); letter-spacing: var(--tracking-tight); }
h3 { font: var(--type-h3); }
h4 { font: var(--type-h4); }
p { margin: 0 0 var(--space-4); }
a {
  color: var(--text-link);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  transition: color var(--duration-fast) var(--ease-standard);
}
a:hover { color: var(--text-link-hover); text-decoration-thickness: 2px; }
a:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}
::selection { background: var(--blue-200); color: var(--gray-900); }

/* ===== Skip Link ===== */
.skip-link {
  position: absolute;
  left: 8px;
  top: -60px;
  background: var(--surface-brand);
  color: var(--text-inverse);
  padding: 12px 20px;
  font: var(--type-label);
  z-index: 10;
  border-radius: var(--radius-md);
  text-decoration: none;
}
.skip-link:focus {
  top: 8px;
  box-shadow: var(--focus-ring-inverse);
  outline: 2px solid transparent;
  color: var(--text-inverse);
}

/* ===== Header ===== */
.site-header {
  background: var(--surface-brand);
  color: var(--text-inverse);
  border-bottom: 3px solid var(--taxi);
}
.site-header-inner {
  max-width: var(--container-content);
  margin: 0 auto;
  padding: 10px var(--gutter-page);
  display: flex;
  align-items: center;
  gap: 8px 16px;
  flex-wrap: wrap;
}
.site-header h1 {
  font: var(--type-label);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-inverse);
  margin: 0;
}
.site-header .subtitle {
  font: var(--type-body-sm);
  color: var(--sky);
  margin: 0;
}

/* ===== Main ===== */
.site-main {
  flex: 1;
  width: 100%;
  box-sizing: border-box;
  max-width: 820px;
  margin: 0 auto;
  padding: 24px var(--gutter-page) 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ===== Breadcrumb ===== */
.breadcrumb ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  font: var(--type-body-sm);
}
.breadcrumb li {
  display: flex;
  align-items: center;
  gap: 8px;
}
.breadcrumb button {
  background: none;
  border: none;
  padding: 4px 0;
  min-height: 24px;
  font: var(--type-body-sm);
  color: var(--text-link);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  cursor: pointer;
}
.breadcrumb button:hover {
  color: var(--text-link-hover);
  text-decoration-thickness: 2px;
}
.breadcrumb button:focus-visible {
  outline: 2px solid transparent;
  box-shadow: var(--focus-ring);
  border-radius: var(--radius-xs);
}
.breadcrumb .crumb-sep {
  color: var(--gray-400);
  display: flex;
}
.breadcrumb .crumb-current {
  color: var(--text-muted);
  padding: 4px 0;
}

/* ===== Start Grid ===== */
.start-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
  gap: 16px;
}
.start-card {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 12px 16px;
  text-align: left;
  padding: 16px 20px;
  background: var(--surface-card);
  border: 1px solid var(--border-control);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  font: inherit;
  color: var(--text-body);
  transition: var(--transition-control), box-shadow var(--duration-fast) var(--ease-standard);
}
.start-card:hover {
  border-color: var(--border-brand);
  box-shadow: var(--shadow-md);
}
.start-card:focus-visible {
  outline: 2px solid transparent;
  border-color: var(--border-focus);
  box-shadow: var(--focus-ring);
}
.start-card-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: var(--radius-md);
  background: var(--surface-brand-subtle);
  color: var(--text-accent);
}
.start-card-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
.start-card-label {
  font: var(--type-h4);
  font-size: 17px;
  color: var(--text-heading);
}
.start-card-desc {
  font: var(--type-body-sm);
  color: var(--text-muted);
}

/* ===== Question Card ===== */
.question-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.question-card-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ===== Eyebrow ===== */
.eyebrow {
  font: var(--type-eyebrow);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-accent);
}
.eyebrow-success {
  display: flex;
  align-items: center;
  gap: 8px;
  font: var(--type-eyebrow);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-success);
}

/* ===== Question Heading ===== */
.question-heading {
  font: var(--type-h3);
  font-weight: 700;
  color: var(--text-heading);
  margin: 0;
  outline: none;
  text-wrap: balance;
}
.rec-heading {
  font: var(--type-h2);
  color: var(--text-heading);
  margin: 0;
  outline: none;
  text-wrap: balance;
}
.start-heading {
  font: var(--type-h2);
  color: var(--text-heading);
  margin: 0;
  outline: none;
  text-wrap: balance;
}

/* ===== Hint ===== */
.hint-text {
  font: var(--type-body);
  color: var(--text-muted);
  max-width: var(--measure-prose);
  text-wrap: pretty;
}

/* ===== Answer Buttons ===== */
.answer-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.answer-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  text-align: left;
  padding: 16px 20px;
  background: var(--surface-card);
  border: 1px solid var(--border-control);
  border-radius: var(--radius-md);
  cursor: pointer;
  font: inherit;
  color: var(--text-body);
  transition: var(--transition-control);
}
.answer-btn:hover {
  background: var(--surface-brand-subtle);
  border-color: var(--border-brand);
}
.answer-btn:focus-visible {
  outline: 2px solid transparent;
  border-color: var(--border-focus);
  box-shadow: var(--focus-ring);
}
.answer-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  flex: none;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  font: var(--type-mono);
  color: var(--text-subtle);
  background: var(--surface-sunken);
}
.answer-content {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.answer-label {
  font: var(--type-body);
  font-weight: 600;
  color: var(--text-heading);
}
.answer-desc {
  font: var(--type-body-sm);
  color: var(--text-muted);
}
.answer-chevron {
  color: var(--text-accent);
  display: flex;
}

/* ===== Recommendation Card ===== */
.rec-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-top: 4px solid var(--rule-brand);
  border-radius: var(--radius-lg);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.rec-card-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ===== Rec Body Styles ===== */
.rec-body {
  font: var(--type-body);
  color: var(--text-body);
  max-width: var(--measure-prose);
}
.rec-body h3 {
  font: var(--type-eyebrow);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-subtle);
  margin: 24px 0 8px;
}
.rec-body h3:first-child {
  margin-top: 0;
}
.rec-body p {
  margin: 0 0 12px;
  text-wrap: pretty;
}
.rec-body ol {
  margin: 0 0 12px;
  padding-left: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rec-body ul {
  margin: 0 0 12px;
  padding-left: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rec-body li {
  padding-left: 4px;
}
.rec-body > :last-child {
  margin-bottom: 0;
}

/* ===== Key Rule (Info Alert) ===== */
.key-rule-alert {
  display: flex;
  gap: 12px;
  padding: 16px;
  background: var(--blue-50);
  border: 1px solid var(--blue-200);
  border-radius: var(--radius-md);
  font: var(--type-body-sm);
  color: var(--text-body);
  line-height: var(--leading-relaxed);
}
.key-rule-alert .alert-icon {
  flex: none;
  color: var(--cuny-blue);
  margin-top: 1px;
}

/* ===== Nav Buttons ===== */
.nav-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 18px;
  font: var(--type-body);
  font-weight: var(--weight-semibold);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition-control);
  text-decoration: none;
  border: 1px solid transparent;
}
.btn:focus-visible {
  outline: 2px solid transparent;
  box-shadow: var(--focus-ring);
}
.btn-primary {
  background: var(--control-primary-bg);
  color: var(--control-primary-fg);
  border-color: var(--control-primary-bg);
}
.btn-primary:hover {
  background: var(--control-primary-bg-hover);
  border-color: var(--control-primary-bg-hover);
}
.btn-secondary {
  background: var(--control-secondary-bg);
  color: var(--control-secondary-fg);
  border-color: var(--control-secondary-border);
}
.btn-secondary:hover {
  background: var(--surface-brand-subtle);
  border-color: var(--control-primary-bg-hover);
  color: var(--control-primary-bg-hover);
}
.btn .btn-icon {
  display: flex;
  flex: none;
}

/* ===== Glossary ===== */
.glossary-section {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.glossary-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 12px 20px;
  background: none;
  border: none;
  cursor: pointer;
  font: var(--type-label);
  color: var(--text-heading);
  text-align: left;
  transition: background-color var(--duration-instant) var(--ease-standard);
}
.glossary-toggle:hover {
  background: var(--surface-hover);
}
.glossary-toggle:focus-visible {
  outline: 2px solid transparent;
  box-shadow: inset 0 0 0 3px var(--border-focus);
}
.glossary-toggle .toggle-icon {
  display: flex;
  color: var(--text-accent);
}
.glossary-panel {
  margin: 0;
  padding: 4px 20px 20px;
  border-top: 1px solid var(--border-subtle);
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.glossary-panel dt {
  font: var(--type-body-sm);
  font-weight: 600;
  color: var(--text-heading);
}
.glossary-panel dd {
  font: var(--type-body-sm);
  color: var(--text-muted);
  margin: 0;
  text-wrap: pretty;
}

/* ===== Footer ===== */
.site-footer {
  background: var(--surface-card);
  border-top: 1px solid var(--border-subtle);
}
.site-footer-inner {

/* ===== Glossary Data ===== */
var GLOSSARY = [
  { title: "Bibliographic record", content: "A record that describes a title (book, journal, video, etc.) with information like author, title, publisher, and subject" },
  { title: "Community Zone (CZ)", content: "Ex Libris’s global shared catalog containing bibliographic records and a Central Knowledge Base (CKB) of electronic portfolios and collections" },
  { title: "Electronic collection", content: "A group of electronic titles from a vendor, such as a database or package" },
  { title: "Electronic portfolio", content: "The electronic equivalent of holdings; links your library to an individual e-resource title" },
  { title: "Holdings", content: "A record attached to a bibliographic record that says “this library owns this item,” including location and call number" },
  { title: "Institution Zone (IZ)", content: "Your institution’s local catalog and holdings; only your library sees these records" },
  { title: "Item record", content: "A record attached to a holdings record for a specific physical copy, including barcode and material type" },
  { title: "Linked copy", content: "When you add holdings to an NZ or CZ record, Alma creates a copy in your IZ that stays connected to the shared record" },
  { title: "Metadata Editor", content: "Alma’s built-in tool for viewing and editing catalog records" },
  { title: "Network Zone (NZ)", content: "CUNY’s shared catalog; records here are visible to all CUNY libraries" },
  { title: "OCLC number", content: "A unique record ID from WorldCat" }
];

var START_ICONS = ["book", "globe", "file-text", "user", "file"];

/* ===== Application State ===== */
var state = {
  current: "start",
  history: [],
  glossOpen: false
};

/* ===== Render Engine ===== */
function render() {
  var main = document.getElementById("tree-main");
  var node = TREE_NODES[state.current];
  if (!node) {
    state.current = "start";
    state.history = [];
    node = TREE_NODES["start"];
  }
  var isStart = state.current === "start";
  var isRec = node.type === "rec";
  var stepNum = state.history.length + 1;
  var showGlossary = state.current !== "start" && state.current !== "rec_digital";

  var html = "";

  /* Breadcrumb */
  if (state.history.length > 0) {
    html += '<nav class="breadcrumb" aria-label="Your answers" data-noprint>';
    html += "<ol>";
    /* "Start" link */
    html += '<li><button type="button" onclick="goTo(0)" title="Back to the first question">Start</button>';
    html += '<span class="crumb-sep" aria-hidden="true">' + icon("chevron-right", 14) + "</span></li>";
    /* Intermediate crumbs */
    for (var i = 0; i < state.history.length - 1; i++) {
      var h = state.history[i];
      var hNode = TREE_NODES[h.nodeId];
      var hTitle = hNode ? hNode.question : "";
      html += '<li><button type="button" onclick="goTo(' + (i + 1) + ')" title="' + escAttr(hTitle) + '">' + esc(h.answerLabel) + "</button>";
      html += '<span class="crumb-sep" aria-hidden="true">' + icon("chevron-right", 14) + "</span></li>";
    }
    /* Current crumb */
    html += '<li aria-current="step" class="crumb-current">' + esc(state.history[state.history.length - 1].answerLabel) + "</li>";
    html += "</ol></nav>";
  }

  /* Start screen */
  if (isStart) {
    html += '<div style="display:flex;flex-direction:column;gap:20px;">';
    html += '<div>';
    html += '<div class="eyebrow" style="margin-bottom:8px;">Step 1</div>';
    html += '<h2 class="start-heading" id="step-heading" tabindex="-1">' + esc(node.question) + "</h2>";
    html += "</div>";
    html += '<div class="start-grid">';
    for (var j = 0; j < node.answers.length; j++) {
      var a = node.answers[j];
      var iconName = START_ICONS[j] || "chevron-right";
      html += '<button type="button" class="start-card" onclick="choose(' + j + ')">';
      html += '<span class="start-card-icon">' + icon(iconName, 20) + "</span>";
      html += '<span class="start-card-text">';
      html += '<span class="start-card-label">' + esc(a.label) + "</span>";
      if (a.desc) {
        html += '<span class="start-card-desc">' + esc(a.desc) + "</span>";
      }
      html += "</span></button>";
    }
    html += "</div></div>";
  }
  /* Question screen */
  else if (!isRec) {
    html += '<div class="question-card">';
    html += '<div class="question-card-header">';
    html += '<div class="eyebrow">Step ' + stepNum + "</div>";
    html += '<h3 class="question-heading" id="step-heading" tabindex="-1">' + esc(node.question) + "</h3>";
    if (node.hint) {
      html += '<div class="hint-text">' + esc(node.hint) + "</div>";
    }
    html += "</div>";
    html += '<div role="group" aria-label="Answers" class="answer-group">';
    for (var k = 0; k < node.answers.length; k++) {
      var ans = node.answers[k];
      html += '<button type="button" class="answer-btn" onclick="choose(' + k + ')">';
      html += '<span class="answer-badge" aria-hidden="true">' + (k + 1) + "</span>";
      html += '<span class="answer-content">';
      html += '<span class="answer-label">' + esc(ans.label) + "</span>";
      if (ans.desc) {
        html += '<span class="answer-desc">' + esc(ans.desc) + "</span>";
      }
      html += "</span>";
      html += '<span class="answer-chevron">' + icon("chevron-right", 20) + "</span>";
      html += "</button>";
    }
    html += "</div></div>";
  }
  /* Recommendation screen */
  else {
    html += '<div class="rec-card">';
    html += '<div class="rec-card-header">';
    html += '<div class="eyebrow-success">' + icon("circle-check", 16) + "<span>Recommendation</span></div>";
    html += '<h2 class="rec-heading" id="step-heading" tabindex="-1">' + esc(node.title) + "</h2>";
    html += "</div>";
    /* Parse body, splitting out key-rule divs */
    html += renderRecBody(node.body);
    html += "</div>";
  }

  /* Navigation buttons */
  if (state.history.length > 0) {
    html += '<div class="nav-buttons" data-noprint>';
    html += '<button type="button" class="btn btn-secondary" onclick="goBack()">';
    html += '<span class="btn-icon">' + icon("arrow-left", 18) + "</span>Back</button>";
    html += '<button type="button" class="btn btn-primary" onclick="reset()">';
    html += '<span class="btn-icon">' + icon("rotate-ccw", 18) + "</span>Start over</button>";
    html += "</div>";
  }

  /* Glossary */
  if (showGlossary) {
    html += '<section class="glossary-section" data-noprint>';
    html += "<h2 style=\"margin:0;font:inherit;\">";
    html += '<button type="button" class="glossary-toggle" aria-expanded="' + (state.glossOpen ? "true" : "false") + '" aria-controls="gloss-panel" onclick="toggleGlossary()">';
    html += "<span>Glossary</span>";
    html += '<span class="toggle-icon">' + icon(state.glossOpen ? "chevron-up" : "chevron-down", 16) + "</span>";
    html += "</button></h2>";
    if (state.glossOpen) {
      html += '<dl id="gloss-panel" class="glossary-panel">';
      for (var g = 0; g < GLOSSARY.length; g++) {
        html += "<div><dt>" + esc(GLOSSARY[g].title) + "</dt>";
        html += "<dd>" + esc(GLOSSARY[g].content) + "</dd></div>";
      }
      html += "</dl>";
    }
    html += "</section>";
  }

  main.innerHTML = html;

  /* Focus heading */
  var heading = document.getElementById("step-heading");
  if (heading) {
    heading.focus({ preventScroll: true });
  }

  /* Smooth scroll to top */
  if (main.getBoundingClientRect().top < 0) {
    window.scrollTo({
      top: window.scrollY + main.getBoundingClientRect().top,
      behavior: "smooth"
    });
  }
}

/* ===== Parse Recommendation Body ===== */
function renderRecBody(bodyHtml) {
  var parts = bodyHtml.split(/<div class="key-rule">([\s\S]*?)<\/div>/);
  var out = "";
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i].trim();
    if (!part) continue;
    if (i % 2 === 1) {
      /* key-rule block => info alert */
      out += '<div class="key-rule-alert">';
      out += '<span class="alert-icon">' + icon("circle-check", 18) + "</span>";
      out += "<div>" + part + "</div>";
      out += "</div>";
    } else {
      /* regular HTML content */
      out += '<div class="rec-body">' + part + "</div>";
    }
  }
  return out;
}

/* ===== Navigation Functions ===== */
function choose(index) {
  var node = TREE_NODES[state.current];
  var answer = node.answers[index];
  state.history.push({
    nodeId: state.current,
    answerLabel: answer.label
  });
  state.current = answer.next;
  render();
}

function goTo(index) {
  state.current = state.history[index].nodeId;
  state.history = state.history.slice(0, index);
  render();
}

function goBack() {
  if (state.history.length > 0) {
    goTo(state.history.length - 1);
  }
}

function reset() {
  state.current = "start";
  state.history = [];
  state.glossOpen = false;
  render();
}

function toggleGlossary() {
  state.glossOpen = !state.glossOpen;
  render();
}

/* ===== Utility ===== */
function esc(str) {
  if (!str) return "";
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function escAttr(str) {
  return esc(str).replace(/"/g, "&quot;");
}

/* ===== Initialize ===== */
render();
</script>
